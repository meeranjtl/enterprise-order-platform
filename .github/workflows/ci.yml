name: CI

# Build + test only — no registry push or deploy step. This is a local/portfolio
# project with no real deployment target, so faking one would be dishonest scope.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Maven build & test (all services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Reactor build in dependency order (shared-library first) — integration tests
      # (XxxIT.java) use TestContainers PostgreSQL/Kafka, which needs Docker; the
      # ubuntu-latest runner has it preinstalled.
      - name: Build and test
        run: mvn -B clean install

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: services/*/target/surefire-reports/*.txt
          retention-days: 7

  frontend:
    name: UI build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
