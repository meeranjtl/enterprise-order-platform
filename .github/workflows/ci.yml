name: CI

# Build + test only — no registry push or deploy step. This is a local/portfolio
# project with no real deployment target, so faking one would be dishonest scope.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Maven build & test (all services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Reactor build in dependency order (shared-library first) — integration tests
      # (XxxIT.java) use TestContainers PostgreSQL/Kafka, which needs Docker; the
      # ubuntu-latest runner has it preinstalled.
      #
      # Retries on transient failures (e.g. Maven Central returning 429 Too Many Requests
      # while resolving a dependency — observed in practice, unrelated to this project's
      # code). -Daether.connector.http.retryHandler.count makes Maven's own resolver retry
      # a single failed download; the outer shell loop re-runs the whole build if that isn't
      # enough, since `install` re-downloads only what a prior attempt didn't already cache
      # in ~/.m2.
      - name: Build and test
        run: |
          for attempt in 1 2 3; do
            if mvn -B clean install -Daether.connector.http.retryHandler.count=3; then
              exit 0
            fi
            echo "Build attempt $attempt failed, retrying..." >&2
            sleep 15
          done
          exit 1

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: services/*/target/surefire-reports/*.txt
          retention-days: 7

  frontend:
    name: UI build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
