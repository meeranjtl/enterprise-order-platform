spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_order?currentSchema=customer
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      default_schema: customer
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
    schemas: customer
    table: flyway_schema_history_customer
    create-schemas: true

server:
  port: 8081
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # Include the correlation ID (set by shared-library's CorrelationIdLoggingFilter) in every line
    level: "%5p [corr=%X{correlationId:-}]"
  level:
    com.enterprise.order: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

