spring:
  application:
    name: customer-service
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_order?currentSchema=customer
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      default_schema: customer
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
    schemas: customer
    table: flyway_schema_history_customer
    create-schemas: true

jwt:
  secret: phase12-dev-only-shared-secret-change-in-production-32bytes-min

server:
  port: 8081
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Log format (JSON) comes from logback-spring.xml; this block only controls levels.
logging:
  level:
    com.enterprise.order: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

