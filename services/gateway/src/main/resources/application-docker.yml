# Docker profile: container hostnames instead of localhost.
# Spring Boot REPLACES list properties on profile merge (it does not merge them),
# so the FULL routes list must be re-declared here — not just the changed URIs.
spring:
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: http://customer-service:8081
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: customerService
                fallbackUri: forward:/fallback/customer-service

        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: productService
                fallbackUri: forward:/fallback/product-service

        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderService
                fallbackUri: forward:/fallback/order-service

        - id: customer-service-api-docs
          uri: http://customer-service:8081
          predicates:
            - Path=/customer-service/api-docs
          filters:
            - RewritePath=/customer-service/api-docs, /api-docs

        - id: product-service-api-docs
          uri: http://product-service:8082
          predicates:
            - Path=/product-service/api-docs
          filters:
            - RewritePath=/product-service/api-docs, /api-docs

        - id: order-service-api-docs
          uri: http://order-service:8083
          predicates:
            - Path=/order-service/api-docs
          filters:
            - RewritePath=/order-service/api-docs, /api-docs

  data:
    redis:
      host: redis
      port: 6379

