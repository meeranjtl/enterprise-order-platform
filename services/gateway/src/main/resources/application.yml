spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes: []

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.enterprise.order: INFO
    org.springframework.cloud.gateway: DEBUG

