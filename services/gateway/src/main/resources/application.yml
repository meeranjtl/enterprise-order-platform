spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Centralized CORS for browser clients (React UI arrives in Phase 13)
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns:
              - "http://localhost:*"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, X-Correlation-Id, X-Requested-With, Accept]
            exposedHeaders: [X-Correlation-Id]
            allowCredentials: true
            maxAge: 3600

      # Applied to every route: Redis-backed token bucket, keyed by client IP.
      # Per-endpoint tuning: add a RequestRateLimiter filter with its own
      # redis-rate-limiter.* args to an individual route (overrides this default).
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

      routes:
        - id: customer-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: customerService
                fallbackUri: forward:/fallback/customer-service

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: productService
                fallbackUri: forward:/fallback/product-service

        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderService
                fallbackUri: forward:/fallback/order-service

        - id: inventory-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryService
                fallbackUri: forward:/fallback/inventory-service

        # Swagger aggregation: proxy each service's OpenAPI docs through the gateway
        - id: customer-service-api-docs
          uri: http://localhost:8081
          predicates:
            - Path=/customer-service/api-docs
          filters:
            - RewritePath=/customer-service/api-docs, /api-docs

        - id: product-service-api-docs
          uri: http://localhost:8082
          predicates:
            - Path=/product-service/api-docs
          filters:
            - RewritePath=/product-service/api-docs, /api-docs

        - id: order-service-api-docs
          uri: http://localhost:8083
          predicates:
            - Path=/order-service/api-docs
          filters:
            - RewritePath=/order-service/api-docs, /api-docs

        - id: inventory-service-api-docs
          uri: http://localhost:8084
          predicates:
            - Path=/inventory-service/api-docs
          filters:
            - RewritePath=/inventory-service/api-docs, /api-docs
        # Future services (added as their phases land):
        # - inventory-service    :8084  /api/v1/inventory/**
        # - payment-service      :8085  /api/v1/payments/**
        # - shipping-service     :8086  /api/v1/shipping/**
        # - notification-service :8087  /api/v1/notifications/**
        # - analytics-service    :8088  /api/v1/analytics/**

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true   # expose /actuator/gateway/routes|routefilters|globalfilters

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    urls:
      - name: Customer Service
        url: /customer-service/api-docs
      - name: Product Service
        url: /product-service/api-docs
      - name: Order Service
        url: /order-service/api-docs

logging:
  level:
    com.enterprise.order: INFO
    org.springframework.cloud.gateway: INFO
    io.github.resilience4j: INFO

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
    instances:
      customerService:
        baseConfig: default
      productService:
        baseConfig: default
      orderService:
        baseConfig: default
  # The Spring Cloud Gateway CircuitBreaker filter applies a TimeLimiter whose
  # default timeout is 1s — override explicitly or every slow call would time out.
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
        cancelRunningFuture: true
    instances:
      customerService:
        baseConfig: default
      productService:
        baseConfig: default
      orderService:
        baseConfig: default

