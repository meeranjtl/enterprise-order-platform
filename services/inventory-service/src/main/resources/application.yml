spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_order?currentSchema=inventory
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
      default_schema: inventory
  flyway:
    enabled: true
    schemas: inventory
    default_schema: inventory
    table: flyway_schema_history_inventory
    create-schemas: true
  kafka:
    bootstrap-servers: localhost:9092
server:
  port: 8084
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints.web.exposure.include: health,metrics,info
inventory:
  kafka:
    enabled: false
