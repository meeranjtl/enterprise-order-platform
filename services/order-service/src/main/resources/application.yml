spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_order?currentSchema=orders
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      default_schema: orders
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
    schemas: orders
    default_schema: orders
    table: flyway_schema_history_order
    create-schemas: true

jwt:
  secret: phase12-dev-only-shared-secret-change-in-production-32bytes-min

# Phase 13: mounts shared-library's OutboxEventController under this service's own
# gateway-routed prefix (/api/v1/orders/**) so the Kafka Events UI page reaches it
# through the existing order-service route — no new gateway route needed.
app:
  events:
    base-path: /api/v1/orders

server:
  port: 8083
  servlet:
    context-path: /

order:
  clients:
    customer-service-url: http://localhost:8081
    product-service-url: http://localhost:8082
    connect-timeout: 2s
    read-timeout: 5s
  pricing:
    tax-rate: 0.10
    flat-shipping-cost: 10.00
    free-shipping-threshold: 100.00

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Log format (JSON) comes from logback-spring.xml; this block only controls levels.
logging:
  level:
    com.enterprise.order: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
