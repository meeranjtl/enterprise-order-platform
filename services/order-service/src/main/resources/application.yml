spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_order?currentSchema=orders
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      default_schema: orders
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
    schemas: orders
    default_schema: orders
    table: flyway_schema_history_order
    create-schemas: true

server:
  port: 8083
  servlet:
    context-path: /

order:
  clients:
    customer-service-url: http://localhost:8081
    product-service-url: http://localhost:8082
    connect-timeout: 2s
    read-timeout: 5s
  pricing:
    tax-rate: 0.10
    flat-shipping-cost: 10.00
    free-shipping-threshold: 100.00

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"
  level:
    com.enterprise.order: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
