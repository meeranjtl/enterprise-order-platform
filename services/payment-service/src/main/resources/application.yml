spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_order?currentSchema=payment
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: payment
    default-schema: payment
    table: flyway_schema_history_payment
    create-schemas: true
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

jwt:
  secret: phase12-dev-only-shared-secret-change-in-production-32bytes-min

# Phase 13: mounts shared-library's OutboxEventController under this service's own
# gateway-routed prefix (/api/v1/payments/**) so the Kafka Events UI page reaches it
# through the existing payment-service route — no new gateway route needed.
app:
  events:
    base-path: /api/v1/payments

server:
  port: 8085

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

payment:
  kafka:
    enabled: false
  retry:
    scan-delay-ms: 1000
