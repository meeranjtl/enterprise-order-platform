spring:
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_order?currentSchema=shipping
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: shipping
    default-schema: shipping
    table: flyway_schema_history_shipping
    create-schemas: true
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

jwt:
  secret: phase12-dev-only-shared-secret-change-in-production-32bytes-min

server:
  port: 8086

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
