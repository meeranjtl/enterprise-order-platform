spring:
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_order?currentSchema=shipping
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: shipping
    default-schema: shipping
    table: flyway_schema_history_shipping
    create-schemas: true
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8086

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
