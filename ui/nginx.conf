server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed by Vite — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: React Router owns client-side routing, so every path
    # that isn't a real file (e.g. a hard refresh on /orders/42) must still
    # resolve to index.html rather than a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
